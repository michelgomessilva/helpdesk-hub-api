[project]
name = "helpdesk-hub-api"
version = "0.1.0"
description = "HelpDesk Hub API backend built with FastAPI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.116.0,<1.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "pytest>=8.4.0,<9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helpdesk_hub_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
